<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Dash</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(0,0,0,.38));border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;color:#fff}
.stat{padding:8px 16px;min-width:120px}
.stat.r{text-align:right}
.stat small{display:block;font-size:11px;letter-spacing:2px;opacity:.8;text-transform:uppercase}
.stat b{font-size:28px;font-weight:900;text-shadow:0 2px 4px #000;font-variant-numeric:tabular-nums}
#speed{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:8px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
#speedBar{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a18);box-shadow:0 0 10px #ff9f1c}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.7));color:#fff}
.card{width:min(380px,100%);padding:26px 24px;text-align:center;animation:rise .45s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
h1{font-family:Georgia,serif;font-size:50px;line-height:1.05;background:linear-gradient(#fff1b0,#f5a623 55%,#b8640b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #4a2300)}
.sub{letter-spacing:4px;font-size:12px;opacity:.85;margin:8px 0 14px;text-transform:uppercase}
p.msg{line-height:1.5;opacity:.92;font-size:15px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 20px;font-size:13px}
.keys span{background:rgba(255,255,255,.12);border-radius:10px;padding:9px 6px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 20px}
.stats div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats small{font-size:10px;letter-spacing:1px;opacity:.8;text-transform:uppercase}
button{width:100%;padding:16px 0;font-size:20px;font-weight:900;letter-spacing:2px;border:0;border-radius:14px;background:linear-gradient(#ffe07a,#f29b12);color:#4a2400;cursor:pointer;box-shadow:0 5px 0 #a35c08,0 12px 22px rgba(0,0,0,.4);animation:glow 1.6s ease-in-out infinite}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #a35c08}
@keyframes glow{50%{filter:brightness(1.12)}}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="stat glass"><small>Distance</small><b id="score">0</b></div>
  <div class="stat glass r"><small>Coins</small><b id="coins">0</b></div>
</div>
<div id="speed"><div id="speedBar"></div></div>
<div id="overlay">
  <div class="card glass">
    <h1 id="title">Temple Dash</h1>
    <div class="sub" id="sub">Escape the ancient ruins</div>
    <p class="msg" id="msg">Dodge the stone blocks and wooden beams, and grab every gold coin you can.</p>
    <div class="stats hidden" id="stats">
      <div><small>Distance</small><b id="fDist">0</b></div>
      <div><small>Coins</small><b id="fCoins">0</b></div>
      <div><small>Best</small><b id="fBest">0</b></div>
    </div>
    <div class="keys" id="keys">
      <span>← → Switch lane</span><span>↑ / Space Jump</span>
      <span>↓ Slide</span><span>Swipe on phone</span>
    </div>
    <button id="btn">RUN</button>
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const PH = 0.8, SLIDE_H = 0.4, LOW_TOP = 0.45, BAR_LO = 0.6, BAR_HI = 0.85, GRAV = 22, JUMP = 8;

let W, H, hy, FOC, camH;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  hy = H * 0.36;
  FOC = Math.min(W * 0.62, H * 0.9);
  camH = (H * 0.9 - hy) / (FOC / 2);
}
addEventListener('resize', resize);
resize();

function proj(x, z, h) {
  const s = FOC / (z + 2);
  return { x: W / 2 + x * s, y: hy + (camH - h) * s, s };
}

let state = 'ready', dist, speed, score, coins, best = 0;
let objs, rowDist, nextGap, player, parts = [], shake = 0;
const clouds = Array.from({ length: 7 }, () => ({ x: Math.random(), y: 0.04 + Math.random() * 0.2, s: 0.6 + Math.random() * 0.8 }));

function reset() {
  dist = 0; speed = 13; score = 0; coins = 0;
  objs = []; rowDist = 0; nextGap = 20; parts = [];
  player = { lane: 0, x: 0, y: 0, vy: 0, slide: 0, run: 0 };
}

function spawnRow() {
  const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
  const blocks = Math.random() < 0.3 ? 2 : 1;
  for (let i = 0; i < blocks; i++) objs.push({ kind: Math.random() < 0.5 ? 'low' : 'high', lane: lanes[i], z: 60 });
  if (Math.random() < 0.8) for (let k = 0; k < 4; k++) objs.push({ kind: 'coin', lane: lanes[blocks], z: 60 + k * 1.2 });
}

function setCard(title, sub, showStats) {
  $('title').textContent = title;
  $('sub').textContent = sub;
  $('msg').classList.toggle('hidden', showStats);
  $('stats').classList.toggle('hidden', !showStats);
  $('keys').classList.toggle('hidden', showStats);
  $('btn').textContent = showStats ? 'RUN AGAIN' : 'RUN';
}

function die() {
  if (state !== 'play') return;
  state = 'dead';
  shake = 0.6;
  best = Math.max(best, score);
  setTimeout(() => {
    state = 'over';
    setCard('Game Over', 'The temple claims another runner', true);
    $('fDist').textContent = Math.floor(dist) + 'm';
    $('fCoins').textContent = coins;
    $('fBest').textContent = best;
    $('overlay').classList.remove('hidden');
  }, 600);
}

function start() {
  reset();
  state = 'play';
  setCard('Temple Dash', 'Escape the ancient ruins', false);
  $('overlay').classList.add('hidden');
}
$('btn').addEventListener('click', start);

function act(a) {
  if (state !== 'play') return;
  if (a === 'left' && player.lane > -1) player.lane--;
  else if (a === 'right' && player.lane < 1) player.lane++;
  else if (a === 'up' && player.y === 0 && player.vy === 0) { player.vy = JUMP; player.slide = 0; }
  else if (a === 'down' && player.y === 0 && player.slide <= 0) player.slide = 0.7;
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  if (state === 'ready' || state === 'over') { if (k === 'enter' || k === ' ') start(); return; }
  if (state !== 'play') return;
  if (k === 'arrowleft' || k === 'a') act('left');
  else if (k === 'arrowright' || k === 'd') act('right');
  else if (k === 'arrowup' || k === 'w' || k === ' ') act('up');
  else if (k === 'arrowdown' || k === 's') act('down');
});

let px0 = 0, py0 = 0, tracking = false;
addEventListener('pointerdown', e => { px0 = e.clientX; py0 = e.clientY; tracking = true; });
addEventListener('pointerup', e => {
  if (!tracking) return;
  tracking = false;
  if (state !== 'play') return;
  const dx = e.clientX - px0, dy = e.clientY - py0;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return act('up');
  if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'left' : 'right');
  else act(dy < 0 ? 'up' : 'down');
});

function update(dt) {
  speed = Math.min(30, 13 + dist * 0.01);
  const d = speed * dt;
  dist += d;
  for (const o of objs) o.z -= d;
  objs = objs.filter(o => o.z > -2);

  rowDist += d;
  if (rowDist >= nextGap) {
    spawnRow();
    rowDist = 0;
    nextGap = Math.max(6, 10 - dist * 0.01) + Math.random() * 3;
  }

  player.x += (player.lane - player.x) * Math.min(1, dt * 12);
  if (player.y > 0 || player.vy > 0) {
    player.vy -= GRAV * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) { player.y = 0; player.vy = 0; }
  }
  if (player.slide > 0) player.slide -= dt;
  player.run += dt * speed * 0.5;

  // dust puffs from the feet
  if (player.y === 0 && Math.random() < 0.6) {
    const s0 = FOC / 2;
    parts.push({ x: W / 2 + player.x * s0 + (Math.random() - 0.5) * 30, y: proj(0, 0, 0).y - 4,
      vx: (Math.random() - 0.5) * 50, vy: -20 - Math.random() * 40, l: 1 });
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.l -= dt * 2; }
  parts = parts.filter(p => p.l > 0);

  const ph = player.slide > 0 ? SLIDE_H : PH;
  for (const o of objs) {
    if (o.hit || o.lane !== player.lane || Math.abs(o.z) > 0.6) continue;
    if (o.kind === 'coin') { o.hit = true; coins++; }
    else {
      const lo = o.kind === 'low' ? 0 : BAR_LO;
      const hi = o.kind === 'low' ? LOW_TOP : BAR_HI;
      if (player.y < hi && player.y + ph > lo) { die(); return; }
    }
  }

  score = Math.floor(dist) + coins * 10;
  $('speedBar').style.width = ((speed - 13) / 17 * 100) + '%';
}

// ---------- Rendering ----------

function quad(x0, x1, z0, z1, color) {
  const a = proj(x0, z0, 0), b = proj(x1, z0, 0), c = proj(x1, z1, 0), d = proj(x0, z1, 0);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  ctx.closePath(); ctx.fill();
}

function box(x0, x1, z, lo, hi, front, top, side) {
  const a = proj(x0, z, lo), b = proj(x1, z, lo), c = proj(x1, z, hi), d = proj(x0, z, hi);
  const e = proj(x0, z + 0.4, hi), f = proj(x1, z + 0.4, hi);
  // right side face for depth
  ctx.fillStyle = side;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y); ctx.lineTo(proj(x1, z + 0.4, lo).x, proj(x1, z + 0.4, lo).y);
  ctx.lineTo(f.x, f.y); ctx.lineTo(c.x, c.y); ctx.closePath(); ctx.fill();
  // front face with gradient
  const g = ctx.createLinearGradient(0, d.y, 0, a.y);
  g.addColorStop(0, front); g.addColorStop(1, side);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  ctx.closePath(); ctx.fill();
  // top face
  ctx.fillStyle = top;
  ctx.beginPath();
  ctx.moveTo(d.x, d.y); ctx.lineTo(c.x, c.y); ctx.lineTo(f.x, f.y); ctx.lineTo(e.x, e.y);
  ctx.closePath(); ctx.fill();
}

function drawSky(T) {
  const sky = ctx.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, '#0f2a55'); sky.addColorStop(0.55, '#4a7fc0'); sky.addColorStop(1, '#ffd08a');
  ctx.fillStyle = sky;
  ctx.fillRect(-50, -50, W + 100, hy + 52);

  const sx = W * 0.72, sy = hy * 0.45;
  const sun = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.45);
  sun.addColorStop(0, 'rgba(255,244,200,1)');
  sun.addColorStop(0.12, 'rgba(255,220,150,.7)');
  sun.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(-50, -50, W + 100, hy + 52);

  const span = W * 1.5;
  for (const c of clouds) {
    const x = (((c.x * span - dist * 3) % span) + span) % span - W * 0.25;
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.ellipse(x, c.y * H, 70 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 50 * c.s, c.y * H - 8 * c.s, 50 * c.s, 14 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ridge('#4b7a6a', H * 0.12, 0.006, 2.1);
  ridge('#2f5e46', H * 0.08, 0.011, 0.7);
  ridge('#1c3b2b', H * 0.05, 0.02, 4.2);
}

function ridge(color, amp, freq, off) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-10, hy + 2);
  for (let x = -10; x <= W + 10; x += 12) {
    const y = hy - amp * (0.5 + 0.5 * Math.sin(x * freq + off)) * (0.6 + 0.4 * Math.sin(x * freq * 2.7 + off * 1.3));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 10, hy + 2);
  ctx.closePath(); ctx.fill();
}

function drawCoin(o, T) {
  const p = proj(o.lane, o.z, 0.5);
  const r = 0.15 * p.s;
  const rx = Math.max(1, r * Math.abs(Math.cos(T * 6 + o.z)));
  const g = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
  g.addColorStop(0, '#fff8c4'); g.addColorStop(0.45, '#ffd23f'); g.addColorStop(1, '#a86a0a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8a5508'; ctx.lineWidth = Math.max(1, r * 0.15); ctx.stroke();
}

function drawTorch(l, z, T) {
  const p = proj(l, z, 1.9);
  const r = 0.14 * p.s;
  const flick = 1 + Math.sin(T * 17 + z) * 0.15 + Math.sin(T * 31 + l) * 0.08;
  const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 6);
  glow.addColorStop(0, 'rgba(255,170,60,.5)'); glow.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(p.x - r * 6, p.y - r * 6, r * 12, r * 12);
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 0.7, r * 1.3 * flick, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff2a8';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + r * 0.2, r * 0.35, r * 0.7 * flick, 0, 0, Math.PI * 2); ctx.fill();
}

function drawPlayer(T) {
  const s0 = FOC / 2, u = PH * s0 / 1.75;          // u ~ one "metre" of the runner's body
  const px = W / 2 + player.x * s0;
  const base = proj(0, 0, player.y).y;
  const groundY = proj(0, 0, 0).y;
  const air = 1 - Math.min(1, player.y * 1.5);
  const skin = '#e8b07a', shirt = '#e8762b', pants = '#2d2a3a', hair = '#2b1a0e';

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(px, groundY, 0.34 * s0 * air + 6, 0.08 * s0 * air + 3, 0, 0, Math.PI * 2);
  ctx.fill();

  const stroke = (c, w, pts) => {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  };

  // Slide: body flat and low, legs stretched behind
  if (player.slide > 0) {
    stroke(pants, 0.15 * u, [[px - 0.1 * u, base - 0.22 * u], [px - 0.62 * u, base - 0.2 * u]]);
    const bg = ctx.createLinearGradient(0, base - 0.3 * u, 0, base);
    bg.addColorStop(0, '#f08a3c'); bg.addColorStop(1, '#a8481a');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.roundRect(px - 0.2 * u, base - 0.3 * u, 0.5 * u, 0.26 * u, 0.12 * u); ctx.fill();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(px + 0.38 * u, base - 0.2 * u, 0.12 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hair;
    ctx.beginPath(); ctx.arc(px + 0.38 * u, base - 0.2 * u, 0.12 * u, Math.PI * 0.9, Math.PI * 1.9); ctx.fill();
    return;
  }

  const g = player.y === 0;
  const amp = state === 'play' ? 1 : 0.12;      // idle pose is almost still
  const ph = player.run * 1.5;                  // gait phase
  const hipY = base - 0.92 * u - (g ? Math.abs(Math.sin(ph)) * 0.05 * u * amp : 0);
  const lean = Math.sin(ph) * 0.025 * u * amp;
  const tTop = hipY - 0.62 * u;

  // Legs (drawn first so the torso overlaps the hips)
  for (const [sg, phase] of [[-1, 0], [1, Math.PI]]) {
    const sw = Math.sin(ph + phase);
    let a, flex;
    if (g) {
      a = sw * 0.5 * amp;                        // forward/back swing
      flex = (0.1 + 0.9 * Math.max(0, -sw)) * amp; // knee bends as the leg kicks back
    } else {
      a = sg < 0 ? 0.7 : 0.45;                   // tucked knees while airborne
      flex = 1.5;
    }
    const hip = [px + sg * 0.1 * u, hipY];
    const knee = [hip[0] + Math.sin(a) * 0.08 * u, hip[1] + Math.cos(a) * 0.45 * u];
    const foot = [knee[0] + Math.sin(a - flex) * 0.2 * u, knee[1] + Math.cos(a - flex) * 0.45 * u];
    stroke(pants, 0.15 * u, [hip, knee]);
    stroke(pants, 0.12 * u, [knee, foot]);
    ctx.fillStyle = '#3b2a1a';
    ctx.beginPath(); ctx.ellipse(foot[0], foot[1] + 0.02 * u, 0.08 * u, 0.045 * u, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Arms (opposite to the legs)
  for (const [sg, phase] of [[-1, Math.PI], [1, 0]]) {
    const sh = [px + sg * 0.2 * u + lean, tTop + 0.06 * u];
    const sw = Math.sin(ph + phase);
    const a = g ? sw * 0.7 * amp : (sg < 0 ? -2.4 : -2.0);
    const bend = g ? 1.1 * amp : 0.5;
    const el = [sh[0] + Math.sin(a) * 0.3 * u, sh[1] + Math.cos(a) * 0.3 * u];
    const fa = a + bend * 0.6;
    const hd = [el[0] + Math.sin(fa) * 0.27 * u, el[1] + Math.cos(fa) * 0.27 * u];
    stroke(shirt, 0.11 * u, [sh, el]);
    stroke(skin, 0.09 * u, [el, hd]);
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(hd[0], hd[1], 0.05 * u, 0, Math.PI * 2); ctx.fill();
  }

  // Torso: tapered shirt with shading and rounded shoulders
  const tg = ctx.createLinearGradient(px - 0.2 * u, 0, px + 0.2 * u, 0);
  tg.addColorStop(0, '#ffa45c'); tg.addColorStop(0.5, shirt); tg.addColorStop(1, '#a8481a');
  ctx.fillStyle = tg;
  ctx.beginPath();
  ctx.moveTo(px - 0.16 * u, hipY + 0.05 * u);
  ctx.lineTo(px - 0.2 * u + lean, tTop + 0.04 * u);
  ctx.quadraticCurveTo(px + lean, tTop - 0.05 * u, px + 0.2 * u + lean, tTop + 0.04 * u);
  ctx.lineTo(px + 0.16 * u, hipY + 0.05 * u);
  ctx.closePath(); ctx.fill();

  // Backpack with straps
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath(); ctx.roundRect(px - 0.17 * u, tTop + 0.06 * u, 0.34 * u, 0.42 * u, 0.07 * u); ctx.fill();
  stroke('#3b2412', 0.03 * u, [[px - 0.12 * u + lean, tTop + 0.04 * u], [px - 0.1 * u, hipY]]);
  stroke('#3b2412', 0.03 * u, [[px + 0.12 * u + lean, tTop + 0.04 * u], [px + 0.1 * u, hipY]]);

  // Neck, ponytail and head
  const hx = px + lean, hyH = tTop - 0.16 * u;
  const sway = Math.sin(ph - 0.8) * 0.07 * u * amp;
  stroke(hair, 0.07 * u, [[hx, hyH + 0.04 * u], [hx + sway * 0.6, hyH + 0.2 * u], [hx + sway, hyH + 0.36 * u]]);
  ctx.fillStyle = skin;
  ctx.fillRect(hx - 0.04 * u, tTop - 0.04 * u, 0.08 * u, 0.1 * u);
  ctx.beginPath(); ctx.arc(hx, hyH, 0.115 * u, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hair;
  ctx.beginPath(); ctx.arc(hx, hyH - 0.01 * u, 0.12 * u, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
}

function render(t) {
  const T = t / 1000;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 30, (Math.random() - 0.5) * shake * 30);

  drawSky(T);

  // grass
  const gg = ctx.createLinearGradient(0, hy, 0, H);
  gg.addColorStop(0, '#5d8f45'); gg.addColorStop(1, '#2e5b2c');
  ctx.fillStyle = gg;
  ctx.fillRect(-50, hy, W + 100, H - hy + 50);

  // wooden plank path: weathered boards across the track, dark gaps, grain and knots
  const base = Math.floor(dist), fr = dist - base;
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  for (let i = 63; i >= 0; i--) {
    const id = base + i + 1;
    const z0 = i + 1 - fr, z1 = z0 + 1;
    quad(-1.5, 1.5, z0, z1, (id & 1) ? '#8a5d33' : '#74492a');
    quad(-1.5, -1.38, z0, z1, '#3a2513');
    quad(1.38, 1.5, z0, z1, '#3a2513');
    for (let j = 0; j < 4; j++) {
      const x = -1.3 + hash(id * 7 + j) * 2.6;
      const p1 = proj(x, z0 + 0.1, 0), p2 = proj(x + (hash(id * 11 + j) - 0.5) * 0.08, z1 - 0.1, 0);
      ctx.strokeStyle = 'rgba(40,22,10,.35)';
      ctx.lineWidth = Math.max(1, 0.015 * p1.s);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    if (hash(id * 3) > 0.6) {
      const k = proj(-0.9 + hash(id * 5) * 1.8, z0 + 0.5, 0);
      ctx.fillStyle = 'rgba(35,18,8,.55)';
      ctx.beginPath(); ctx.ellipse(k.x, k.y, 0.07 * k.s, 0.03 * k.s, 0, 0, Math.PI * 2); ctx.fill();
    }
    const a = proj(-1.5, z0, 0), b = proj(1.5, z0, 0);
    ctx.strokeStyle = '#1d120a';
    ctx.lineWidth = Math.max(1, 0.07 * FOC / (z0 + 2));
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // atmospheric haze over the far road
  const fog = ctx.createLinearGradient(0, hy, 0, hy + H * 0.3);
  fog.addColorStop(0, 'rgba(255,205,140,.6)'); fog.addColorStop(1, 'rgba(255,205,140,0)');
  ctx.fillStyle = fog;
  ctx.fillRect(-50, hy, W + 100, H * 0.3);

  // drawables sorted far to near
  const dr = [];
  for (const o of objs) if (o.z > -0.5 && !o.hit) dr.push(o);
  for (let k = 0; k < 15; k++) {
    const z = k * 4 + 4 - (dist % 4);
    dr.push({ kind: 'pillar', lane: -2.3, z }, { kind: 'pillar', lane: 2.3, z });
  }
  dr.sort((a, b) => b.z - a.z);

  for (const o of dr) {
    const l = o.lane;
    if (o.kind === 'low') {
      box(l - 0.35, l + 0.35, o.z, 0, LOW_TOP, '#a8794a', '#d4a46e', '#5e3f22');
    } else if (o.kind === 'high') {
      box(l - 0.42, l - 0.36, o.z, 0, BAR_HI, '#4a2c17', '#6b4226', '#2e1a0b');
      box(l + 0.36, l + 0.42, o.z, 0, BAR_HI, '#4a2c17', '#6b4226', '#2e1a0b');
      box(l - 0.42, l + 0.42, o.z, BAR_LO, BAR_HI, '#c0392b', '#e8705f', '#7a1f17');
    } else if (o.kind === 'coin') {
      drawCoin(o, T);
    } else if (o.kind === 'pillar') {
      box(l - 0.25, l + 0.25, o.z, 0, 1.8, '#d9c39c', '#f4e6c4', '#8f7650');
      drawTorch(l, o.z, T);
    }
  }

  drawPlayer(T);

  for (const p of parts) {
    ctx.fillStyle = `rgba(230,200,150,${p.l * 0.5})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + (1 - p.l) * 5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // red flash on death
  if (shake > 0) { ctx.fillStyle = `rgba(200,30,20,${shake * 0.35})`; ctx.fillRect(0, 0, W, H); }

  $('score').textContent = score;
  $('coins').textContent = coins;
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  if (state === 'play') update(dt);
  else if (state === 'ready' || state === 'over') player.run += dt * 6;
  if (shake > 0) shake = Math.max(0, shake - dt * 1.5);
  render(t);
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
